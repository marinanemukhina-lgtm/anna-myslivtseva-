name: Synthetic booking and owner PostgreSQL checks

on:
  pull_request:
    paths:
      - '.github/workflows/booking-postgres.yml'
      - 'tests/private-booking-postgres.test.mjs'
      - 'tests/owner-handoff-postgres.test.mjs'
      - 'tests/helpers/active-owner-source.mjs'
      - 'shared/owner-handoff-mode.mjs'
      - 'server/db.mjs'
      - 'server/owner-handoff.mjs'
      - 'server/private-booking-state.mjs'
      - 'shared/booking.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# No production environment, repository writes, application startup or deploy.
# Credentials below are public synthetic fixture values, never repository secrets.
permissions:
  contents: read

jobs:
  postgres-booking:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booking_synthetic
          POSTGRES_PASSWORD: booking-synthetic-only
          POSTGRES_DB: booking_synthetic
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U booking_synthetic -d booking_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install official PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check real PostgreSQL concurrency, transfer and recovery
        env:
          DATABASE_URL: ''
          BOOKING_POSTGRES_TEST_ALLOW_WRITE: synthetic-only
          BOOKING_POSTGRES_TEST_URL: postgresql://booking_synthetic:booking-synthetic-only@127.0.0.1:55432/booking_synthetic
          OWNER_HANDOFF_POSTGRES_TEST_ALLOW_WRITE: synthetic-only
          OWNER_HANDOFF_POSTGRES_TEST_URL: postgresql://booking_synthetic:booking-synthetic-only@127.0.0.1:55432/booking_synthetic
        run: node --test tests/private-booking-postgres.test.mjs tests/owner-handoff-postgres.test.mjs
