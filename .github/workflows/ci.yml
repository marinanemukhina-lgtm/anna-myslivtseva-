name: Проверка проекта
on:
  push:
    branches-ignore:
      - feat/anna-quality-20261101
  pull_request:
jobs:
  verify:
    if: github.head_ref != 'feat/anna-quality-20261101' && github.ref_name != 'feat/anna-quality-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:sites
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: .qa/
          retention-days: 7
          include-hidden-files: true
